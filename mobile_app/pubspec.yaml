name: chakri_ai
description: চাকরি AI - চাকরিপ্রার্থীদের জন্য AI ভিত্তিক ক্যারিয়ার সহায়ক অ্যাপ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: assets/icon/icon_fg.png

flutter:
  uses-material-design: true
